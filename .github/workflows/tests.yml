name: Run Calma Tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps

      - name: Run tests
        env:
          CALMA_URL: ${{ secrets.CALMA_URL }}
          CALMA_EMAIL: ${{ secrets.CALMA_EMAIL }}
          CALMA_PASSWORD: ${{ secrets.CALMA_PASSWORD }}
        run: python -m pytest calma_test.py test_create_task.py -v
